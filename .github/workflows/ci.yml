# Build and test on every platform RASA targets.
#
# Windows is not an afterthought here (decision 6 makes it the priority
# platform), and it is also where the interesting bugs live: the port-freedom
# probe and the reachability self-check both had to be fixed for the way
# Windows treats a wildcard bind alongside a loopback one, which a Linux-only
# matrix would never have caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The race detector is where a UI that publishes model snapshots from a
      # background pipeline earns its keep, so it runs on one platform rather
      # than none.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  assets:
    name: Wizard assets parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wizard's script is embedded in the binary and served to a browser,
      # so nothing in the Go build or test suite ever parses it. A single
      # malformed string literal takes the whole file out, and the symptom is a
      # blank page with no error reported anywhere - which is exactly how it
      # was found, during a live run.
      - name: Syntax-check the embedded JavaScript
        run: node --check internal/ui/assets/app.js

      # Catches the other half of the same class: an element the script talks
      # to that no longer exists in the markup.
      - name: Check every referenced element id exists
        run: |
          missing=""
          # cut rather than a sed backreference: escaping a backreference through
          # several layers of tooling is how a literal control character ended up
          # in this file and made the whole workflow unparseable.
          ids=$(grep -o 'getElementById("[a-z0-9-]*"' internal/ui/assets/app.js | cut -d'"' -f2 | sort -u)
          for id in $ids; do
            grep -q "id=\"$id\"" internal/ui/assets/index.html || missing="$missing $id"
          done
          if [ -n "$missing" ]; then
            echo "app.js references ids absent from index.html:$missing"
            exit 1
          fi
          echo "ok: every referenced id exists"

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every platform must at least compile, including the one that is out of
      # scope for distribution: macOS is unshippable without notarization
      # (decision 13), but a build failure there is still a bug.
      - name: Build every target
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  dependencies:
    name: Dependencies stay on the allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # RASA is an unsigned binary asking for administrator rights on a home
      # machine. Every dependency it takes is one more thing a cautious user
      # has to trust, so the set is small, pinned, and enforced here rather
      # than described in a README that quietly stops being true.
      #
      # Adding to this list is a deliberate act. The bar is: could we write it
      # ourselves and be confident it is correct? For the QR encoder the answer
      # turned out to be no, which is why rsc.io/qr is on it.
      - name: Check the dependency graph
        run: |
          allowed="rsc.io/qr"
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/AHouseOfBards/RASA-for-Jellyfin' || true)
          unexpected=""
          for dep in $deps; do
            ok=""
            for prefix in $allowed; do
              case "$dep" in
                "$prefix"|"$prefix"/*) ok=1 ;;
              esac
            done
            [ -n "$ok" ] || unexpected="$unexpected $dep"
          done
          if [ -n "$unexpected" ]; then
            echo "Unexpected dependencies:"
            for d in $unexpected; do echo "  $d"; done
            echo
            echo "Add to the allowlist above only after deciding it is worth the trust."
            exit 1
          fi
          echo "ok: standard library plus $allowed"

      # A dependency that is pinned but not verifiable is not pinned.
      - name: Verify module checksums
        run: go mod verify
