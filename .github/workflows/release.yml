# Builds the release assets for a tag.
#
# Everything here is unsigned by design (decision 13: no code-signing budget).
# SmartScreen will warn on every Windows download and reputation never
# accumulates, because it attaches to the file hash rather than to a publisher.
# The mitigation is honest documentation and published checksums, which is why
# the checksum step is not optional.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  CADDY_VERSION: v2.10.0
  DYNU_VERSION: v1.0.0
  RATELIMIT_VERSION: v0.1.0

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # inputs.version is tested first, because shell default-expansion cannot
      # be the test here: on a workflow_dispatch GITHUB_REF_NAME is set, to the
      # branch name, so ${GITHUB_REF_NAME:-...} never fell through to the
      # input. Every manual build came out labelled "main" and was compiled
      # with -X main.version=main.
      - name: Resolve version
        id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      # The bundled proxy is built with the two modules the generated config
      # uses, and the script fails if either is missing from the result.
      - name: Build the bundled Caddy
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUT: ./dist/caddy${{ matrix.ext }}
        run: sh packaging/caddy/build.sh

      # staging=0 is the one thing a release must set deliberately. Development
      # builds default to Let's Encrypt staging so that a day of debugging
      # cannot exhaust the production rate limit (SPEC.md §19); leaving that
      # default in a release would ship certificates no browser trusts.
      - name: Build RASA
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.staging=0"

          # No console window on Windows. Someone double-clicking an installer
          # should not get a black window sitting behind the wizard for the
          # whole run, looking like something they were not meant to see.
          #
          # rasa itself only: rasa-sync runs as a SYSTEM scheduled task with no
          # interactive desktop, so it never shows one, and leaving it a
          # console binary keeps it debuggable by hand.
          #
          # The binary reattaches to a parent console when it has one, so
          # running it from a terminal still prints -- and a browser that never
          # appears is caught by a watchdog that shows the address in a dialog,
          # since the printed address it used to rely on is now invisible.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H=windowsgui"
          fi

          go build -trimpath -ldflags "$LDFLAGS" -o "dist/rasa${{ matrix.ext }}" ./cmd/rasa
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/rasa-sync${{ matrix.ext }}" ./cmd/rasa-sync

      - name: Package (Windows installer)
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          cp packaging/windows/rasa.nsi dist/
          cd dist
          makensis -DVERSION="${{ steps.version.outputs.value }}" rasa.nsi
          mv rasa-setup-windows-x64.exe "../rasa-setup-${{ steps.version.outputs.value }}-windows-amd64.exe"

      - name: Package (Linux tarball)
        if: matrix.goos == 'linux'
        run: |
          cp packaging/linux/install.sh dist/
          tar -czf "rasa-${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            -C dist rasa rasa-sync caddy install.sh

      # With no signature, a published hash is the only integrity signal a
      # cautious user has. It is generated here rather than by hand so that it
      # cannot drift from the artefact it describes.
      - name: Checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(rasa-*.exe rasa-*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artefacts were produced" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | tee "checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: rasa-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rasa-*.exe
            rasa-*.tar.gz
            checksums-*.txt

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Collect checksums
        run: cat assets/checksums-*.txt > assets/SHA256SUMS.txt

      # The tag stays v0.5.0-beta, because that is what a version is, but the
      # release is called "0.5.0 Beta". The name is what shows on the
      # repository page, so that is where the warning has to be legible to
      # someone who is not reading tag suffixes.
      - name: Compose the release name
        id: name
        run: |
          tag="$GITHUB_REF_NAME"
          name="${tag#v}"
          case "$tag" in
            *-beta)  name="${name%-beta} Beta" ;;
            *-alpha) name="${name%-alpha} Alpha" ;;
            *-rc*)   name="${name%-rc*} RC${tag##*-rc}" ;;
          esac
          echo "value=$name" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.name.outputs.value }}

          # Deliberately NOT a GitHub prerelease, even though it is a beta.
          #
          # A prerelease is hidden from the repository page and excluded from
          # the /releases/latest API, which means the only build there is
          # cannot be found by someone who lands on the project or by
          # install.sh. Being discoverable is worth more here than the flag;
          # the word Beta is carried in the release name and the notes say
          # plainly what has not been tested.
          prerelease: false
          make_latest: "true"
          files: |
            assets/rasa-*
            assets/SHA256SUMS.txt
          # Written for whoever lands on the download page: how to install it
          # and what to expect afterwards, and nothing else. How it works goes
          # in the README.
          #
          # This replaces the tag message rather than adding to it, so a
          # what's-new list has to be written onto the release by hand after
          # publishing. Worth knowing before wording a tag message as though
          # anyone will read it.
          body: |
            ## Installing

            **Windows.** Download the `.exe` and run it. Accept the
            administrator prompt. Windows will warn you that the publisher is
            unknown, because RASA is not code signed. Click **More info**, then
            **Run anyway**.

            **Linux.** Download the `.tar.gz`, unpack it, and run
            `sudo ./install.sh`.

            If you want to check your download first, compare it against
            `SHA256SUMS.txt` below.

            ## Afterwards

            RASA is only the setup app. Once it has finished you can uninstall
            it and your remote access keeps working.

            To turn remote access off, run RASA again and choose **Remove
            remote access** before uninstalling.
